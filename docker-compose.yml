version: '3.8'

services:
  moca:
    build: .
    container_name: moca
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/server/src/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/recipe/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3