
services:
  moca:
    build: .
    container_name: moca
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/server/src/data
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      # Node statt wget: das Image bringt nur node mit (/usr/local/bin/node), kein wget.
      # Der alte Check lief deshalb ab dem ersten Tag auf Exit 1 und meldete moca
      # 51 Tage lang faelschlich als "unhealthy" (FailingStreak 147828), obwohl
      # /recipe/api/health durchgehend HTTP 200 lieferte. Fix 2026-10-19.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/recipe/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
